# --- SoulPulse Production HTTP server ---
server {
    listen 80;
    server_name _;

    # Identify environment on every response
    add_header X-Environment "production" always;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Flutter web frontend root
    root /usr/share/nginx/html;
    index index.html;

    # Static files (backend uploads) – proxy to backend with 1-day cache
    location /static/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Environment "production" always;
    }

    # WebSocket endpoint for real-time chat
    location /api/chat/ws/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Admin SPA frontend
    location /admin/ {
        alias /usr/share/nginx/admin-html/;
        try_files $uri $uri/ /admin/index.html;
    }

    # Admin SPA index.html – never cache so updates ship immediately
    location = /admin/index.html {
        alias /usr/share/nginx/admin-html/index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Environment "production" always;
    }

    # Admin API requests -> admin-backend on port 8002
    location /api/admin/ {
        proxy_pass http://admin-backend:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # All other API requests -> backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 10M;
    }

    # Backend health check
    location = /health {
        proxy_pass http://backend:8001/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flutter SPA index.html – never cache so users always get the latest shell
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Environment "production" always;
    }

    # Flutter framework/runtime assets – short cache (frequently updated)
    location ~* ^/(main\.dart\.js|flutter\.js|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json|manifest\.json)$ {
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Environment "production" always;
        try_files $uri =404;
    }

    # Flutter web SPA fallback – serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}

<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="soulpulse">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>soulpulse</title>
  <link rel="manifest" href="manifest.json">

  <!-- API Configuration - override this for production deployment -->
  <script>
    // Set your production API URL here
    // Example: 'https://api.yourdomain.com' or 'http://your-server-ip:8001'
    window.API_BASE_URL = 'http://localhost:8001';
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
          console.log('[App] Service Worker registered with scope:', registration.scope);

          // Check for updates periodically (every 60 minutes)
          setInterval(function() {
            registration.update();
          }, 60 * 60 * 1000);

          // Notify user when a new version is available
          registration.addEventListener('updatefound', function() {
            var newWorker = registration.installing;
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[App] New version available. Refresh to update.');
              }
            });
          });
        }).catch(function(error) {
          console.warn('[App] Service Worker registration failed:', error);
        });
      });
    }
  </script>
</body>
</html>

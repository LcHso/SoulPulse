# =============================================================================
# SoulPulse - Production Stack
# =============================================================================
# Self-contained production compose file. Run with:
#   docker compose -f docker-compose.prod.yml -p soulpulse-prod up -d
#
# Required env vars (or use defaults):
#   PG_PASSWORD - PostgreSQL password for the soulpulse user
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: soulpulse-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soulpulse
      POSTGRES_USER: soulpulse
      POSTGRES_PASSWORD: ${PG_PASSWORD:-soulpulse_prod_2024}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - soulpulse-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulpulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------------------------------------------------------------------
  # Backend API (port 8001 inside container, NOT exposed to host)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soulpulse-prod-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://soulpulse:${PG_PASSWORD:-soulpulse_prod_2024}@postgres:5432/soulpulse
    volumes:
      - ./backend/static:/app/static
      - ./data/chroma_data:/app/chroma_data
    networks:
      - soulpulse-prod-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Admin Backend (port 8002, NOT exposed to host)
  # ---------------------------------------------------------------------------
  admin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soulpulse-prod-admin
    restart: unless-stopped
    command: ["python3", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8002"]
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://soulpulse:${PG_PASSWORD:-soulpulse_prod_2024}@postgres:5432/soulpulse
    volumes:
      - ./backend/static:/app/static
      - ./data/chroma_data:/app/chroma_data
    networks:
      - soulpulse-prod-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Scheduler (background workers)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soulpulse-prod-scheduler
    restart: unless-stopped
    command: ["python3", "scripts/run_all_schedulers.py"]
    env_file:
      - ./backend/.env.production
    environment:
      DATABASE_URL: postgresql+asyncpg://soulpulse:${PG_PASSWORD:-soulpulse_prod_2024}@postgres:5432/soulpulse
    volumes:
      - ./backend/static:/app/static
      - ./data/chroma_data:/app/chroma_data
    networks:
      - soulpulse-prod-net
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Nginx (only service exposing host ports)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: soulpulse-prod-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf.d/soulpulse-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/build/web:/usr/share/nginx/html:ro
      - ./admin-frontend/dist:/usr/share/nginx/admin-html:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - soulpulse-prod-net
    depends_on:
      - backend
      - admin-backend
    deploy:
      resources:
        limits:
          memory: 256M

networks:
  soulpulse-prod-net:
    driver: bridge
